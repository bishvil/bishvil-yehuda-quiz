<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Tagline lockup</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bsy-paper); font-family: var(--font-body); display: flex; align-items: center; justify-content: center; min-height: 200px; }
  .lockup { text-align: center; }
  .mark { font-family: var(--font-display); font-weight: 700; font-size: 64px; color: var(--bsy-brown); line-height: 1; }
  .rule { display: flex; align-items: center; gap: 10px; justify-content: center; margin-top: 10px; }
  .rule .line { width: 36px; height: 1.5px; background: var(--bsy-green-bright); }
  .tag { font-family: var(--font-hand); font-size: 18px; color: var(--bsy-green-forest); }
</style>
</head>
<body>
<div class="lockup">
  <div class="mark">בשביל יהודה</div>
  <div class="rule"><span class="line"></span><span class="tag">מורשת בדרך ערך</span><span class="line"></span></div>
</div>
</body>
</html>
