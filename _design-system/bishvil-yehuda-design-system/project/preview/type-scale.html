<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Type — Scale Tokens</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bsy-paper); }
  table { width: 100%; border-collapse: collapse; font-family: var(--font-body); }
  td { padding: 6px 8px; border-bottom: 1px dashed var(--bsy-stone-100); vertical-align: middle; }
  td.token { font-family: var(--font-mono); font-size: 12px; color: var(--bsy-green-forest); width: 90px; }
  td.px { font-family: var(--font-mono); font-size: 11px; color: var(--bsy-stone-400); width: 60px; text-align: end; }
  td.eg { color: var(--bsy-ink); font-family: var(--font-display); }
</style>
</head>
<body>
<table>
  <tr><td class="token">--fs-2xs</td><td class="px">12px</td><td class="eg" style="font-size: 12px;">בשביל יהודה — מורשת בדרך ערך</td></tr>
  <tr><td class="token">--fs-xs</td><td class="px">13px</td><td class="eg" style="font-size: 13px;">בשביל יהודה — מורשת בדרך ערך</td></tr>
  <tr><td class="token">--fs-sm</td><td class="px">15px</td><td class="eg" style="font-size: 15px;">בשביל יהודה — מורשת בדרך ערך</td></tr>
  <tr><td class="token">--fs-md</td><td class="px">16px</td><td class="eg" style="font-size: 16px;">בשביל יהודה — מורשת בדרך ערך</td></tr>
  <tr><td class="token">--fs-lg</td><td class="px">18px</td><td class="eg" style="font-size: 18px;">בשביל יהודה</td></tr>
  <tr><td class="token">--fs-xl</td><td class="px">22px</td><td class="eg" style="font-size: 22px;">בשביל יהודה</td></tr>
  <tr><td class="token">--fs-2xl</td><td class="px">28px</td><td class="eg" style="font-size: 28px;">בשביל יהודה</td></tr>
  <tr><td class="token">--fs-3xl</td><td class="px">36px</td><td class="eg" style="font-size: 36px;">בשביל יהודה</td></tr>
</table>
</body>
</html>
