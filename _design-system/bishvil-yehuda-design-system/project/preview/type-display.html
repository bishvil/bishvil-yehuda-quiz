<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Type — Display</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--bsy-paper); }
  .row { display: flex; align-items: baseline; gap: 18px; padding: 6px 0; border-bottom: 1px dashed var(--bsy-stone-100); }
  .row:last-child { border-bottom: 0; }
  .meta { flex: 0 0 110px; font-family: var(--font-body); font-size: 11px; color: var(--bsy-stone-400); font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; }
  .specimen { font-family: var(--font-display); color: var(--bsy-brown); line-height: 1.05; font-weight: 400; }
</style>
</head>
<body>
<div class="row"><div class="meta">H1 · 64 / 400</div><div class="specimen" style="font-size: 64px;">בשביל יהודה</div></div>
<div class="row"><div class="meta">H2 · 44 / 400</div><div class="specimen" style="font-size: 44px;">תחנה הבאה: חברון</div></div>
<div class="row"><div class="meta">H3 · 32 / 400</div><div class="specimen" style="font-size: 32px;">סיפור המקום</div></div>
<div class="row"><div class="meta">H4 · 24 / 400</div><div class="specimen" style="font-size: 24px;">מורשת בדרך ערך</div></div>
</body>
</html>
