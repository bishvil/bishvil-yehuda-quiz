<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Radii & Shadows</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px; background: var(--bsy-paper); font-family: var(--font-body); }
  h6 { font-family: var(--font-body); font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--bsy-stone-400); margin: 0 0 8px; }
  .row { display: flex; gap: 12px; margin-bottom: 14px; }
  .chip {
    background: #fff; min-width: 70px; height: 56px; display: flex; align-items: center; justify-content: center;
    font-family: var(--font-mono); font-size: 11px; color: var(--bsy-stone-700);
    border: 1px solid var(--color-border);
  }
  .shadow-card { background: #fff; padding: 12px 16px; border-radius: var(--radius-md); font-family: var(--font-mono); font-size: 11px; color: var(--bsy-stone-700); }
</style>
</head>
<body>
<h6>Radii</h6>
<div class="row">
  <div class="chip" style="border-radius: var(--radius-xs);">xs · 2</div>
  <div class="chip" style="border-radius: var(--radius-sm);">sm · 6</div>
  <div class="chip" style="border-radius: var(--radius-md);">md · 12</div>
  <div class="chip" style="border-radius: var(--radius-lg);">lg · 20</div>
  <div class="chip" style="border-radius: var(--radius-xl);">xl · 28</div>
  <div class="chip" style="border-radius: var(--radius-pill);">pill</div>
</div>
<h6>Shadows</h6>
<div class="row">
  <div class="shadow-card" style="box-shadow: var(--shadow-xs);">xs</div>
  <div class="shadow-card" style="box-shadow: var(--shadow-sm);">sm</div>
  <div class="shadow-card" style="box-shadow: var(--shadow-md);">md</div>
  <div class="shadow-card" style="box-shadow: var(--shadow-lg);">lg</div>
</div>
</body>
</html>
