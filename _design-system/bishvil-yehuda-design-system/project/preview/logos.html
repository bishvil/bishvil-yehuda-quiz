<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Logos</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--bsy-paper); font-family: var(--font-body); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell { background: #fff; border-radius: var(--radius-md); border: 1px solid var(--color-border); padding: 10px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .cell img { max-width: 100%; max-height: 90px; object-fit: contain; }
  .label { font-size: 11px; color: var(--bsy-stone-700); font-weight: 700; text-align: center; }
</style>
</head>
<body>
<div class="grid">
  <div class="cell"><img src="../assets/logos/logo_main.png" alt=""><div class="label">בשביל · master</div></div>
  <div class="cell"><img src="../assets/logos/logo_yehuda.png" alt=""><div class="label">בשביל יהודה</div></div>
  <div class="cell"><img src="../assets/logos/logo_haari.png" alt=""><div class="label">בשביל הארי</div></div>
  <div class="cell"><img src="../assets/logos/logo_tzafon.png" alt=""><div class="label">בשביל הצפון</div></div>
  <div class="cell"><img src="../assets/logos/logo_etzion.png" alt=""><div class="label">בשביל עציון</div></div>
  <div class="cell"><img src="../assets/logos/logo_shomeron.png" alt=""><div class="label">בשביל השומרון</div></div>
  <div class="cell"><img src="../assets/logos/logo_haganat.png" alt=""><div class="label">הגנת היישוב</div></div>
</div>
</body>
</html>
