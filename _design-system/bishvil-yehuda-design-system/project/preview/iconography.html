<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Iconography</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 22px; background: var(--bsy-paper); font-family: var(--font-body); }
  .row { display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
  .icon-cell { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 60px; }
  .icon-cell svg { color: var(--bsy-green-forest); }
  .icon-cell .l { font-size: 11px; color: var(--bsy-stone-400); }
</style>
</head>
<body>
<div class="row">
  <div class="icon-cell"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14.106 5.553a2 2 0 0 0 1.788 0l3.659-1.83A1 1 0 0 1 21 4.619v12.764a1 1 0 0 1-.553.894l-4.553 2.277a2 2 0 0 1-1.788 0l-4.212-2.106a2 2 0 0 0-1.788 0l-3.659 1.83A1 1 0 0 1 3 19.381V6.618a1 1 0 0 1 .553-.894l4.553-2.277a2 2 0 0 1 1.788 0z"/><path d="M15 5.764v15"/><path d="M9 3.236v15"/></svg><div class="l">map</div></div>

  <div class="icon-cell"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="m8 3 4 8 5-5 5 15H2L8 3z"/></svg><div class="l">mountain</div></div>
  <div class="icon-cell"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></svg><div class="l">clock</div></div>
  <div class="icon-cell"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg><div class="l">cal</div></div>

  <div class="icon-cell"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg><div class="l">menu</div></div>

</div>
<p style="margin-top: 14px; font-size: 11px; color: var(--bsy-stone-400);">Lucide @ stroke-1.5, in <code style="font-family: var(--font-mono)">--bsy-green-forest</code>. ⚠ Substitution — no in-house icon set provided.</p>

</html>
