<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<title>Spacing scale</title>
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 18px 22px; background: var(--bsy-paper); font-family: var(--font-body); }
  .row { display: flex; align-items: center; gap: 12px; padding: 4px 0; }
  .token { font-family: var(--font-mono); font-size: 11px; color: var(--bsy-green-forest); width: 80px; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--bsy-stone-400); width: 44px; text-align: end; }
  .bar { background: var(--bsy-green-bright); height: 12px; border-radius: 3px; }
</style>
</head>
<body>
<div class="row"><div class="token">--space-1</div><div class="px">4</div><div class="bar" style="width: 4px;"></div></div>
<div class="row"><div class="token">--space-2</div><div class="px">8</div><div class="bar" style="width: 8px;"></div></div>
<div class="row"><div class="token">--space-3</div><div class="px">12</div><div class="bar" style="width: 12px;"></div></div>
<div class="row"><div class="token">--space-4</div><div class="px">16</div><div class="bar" style="width: 16px;"></div></div>
<div class="row"><div class="token">--space-5</div><div class="px">24</div><div class="bar" style="width: 24px;"></div></div>
<div class="row"><div class="token">--space-6</div><div class="px">32</div><div class="bar" style="width: 32px;"></div></div>
<div class="row"><div class="token">--space-7</div><div class="px">40</div><div class="bar" style="width: 40px;"></div></div>
<div class="row"><div class="token">--space-8</div><div class="px">48</div><div class="bar" style="width: 48px;"></div></div>
<div class="row"><div class="token">--space-9</div><div class="px">64</div><div class="bar" style="width: 64px;"></div></div>
<div class="row"><div class="token">--space-10</div><div class="px">80</div><div class="bar" style="width: 80px;"></div></div>
</body>
</html>
